services:
  bridge:
    build:
      context: ../..
      dockerfile: official-bots/discord-bridge/Dockerfile
    restart: unless-stopped
    init: true
    env_file: .env
    volumes:
      - bridge-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  bridge-data:
