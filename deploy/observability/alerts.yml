groups:
  - name: kaede-release
    rules:
      - alert: KaedeAPIDown
        expr: absent(kaede_up) or max(kaede_up) == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "Kaede API metrics are unavailable" }
      - alert: KaedeFederationBacklog
        expr: kaede_federation_outbox_pending > 1000
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Kaede federation backlog exceeds 1000 events" }
      - alert: KaedeFederationFailures
        expr: increase(kaede_federation_delivery_failures_total[15m]) > 20
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Kaede federation delivery failures are elevated" }
      - alert: KaedeFederationStorageQuota
        expr: increase(kaede_federation_inbox_quota_rejections_total[15m]) > 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Kaede is deferring federation events because retained storage is full" }
      - alert: KaedeFederationInboxCapacity
        expr: >-
          kaede_federation_inbox_retained_events / kaede_federation_inbox_capacity_events > 0.8
          or
          kaede_federation_inbox_retained_bytes / kaede_federation_inbox_capacity_bytes > 0.8
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Kaede federation inbox storage is above 80% of its configured limit" }
      - alert: KaedeFederationReplicaQuotaPaused
        expr: kaede_federation_replica_quota_paused_guilds > 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "One or more remote guild replicas are paused by a storage quota" }
      - alert: KaedeFederationRemoteMediaCacheFull
        expr: increase(kaede_federation_remote_media_cache_quota_rejections_total[15m]) > 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Kaede remote-media LRU cache is deferring admissions at its hard ceiling" }
      - alert: KaedePushHomeOutboxDelayed
        expr: kaede_push_home_outbox_oldest_age_seconds > 30
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Kaede push wakes are not reaching the configured relay promptly" }
      - alert: KaedePushRelayQueueDelayed
        expr: kaede_push_relay_queue_oldest_age_seconds > 30
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Kaede push relay provider delivery is delayed" }
