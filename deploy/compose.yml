      condition: service_healthy
    dragonfly:
      condition: service_healthy

x-validation-environment: &validation-environment
  KAEDE_DOMAIN: ${KAEDE_DOMAIN:?set KAEDE_DOMAIN}
  KAEDE_ENVIRONMENT: ${KAEDE_ENVIRONMENT:-test}
  KAEDE_SECRET_KEY: ${KAEDE_SECRET_KEY:?set KAEDE_SECRET_KEY}
  KAEDE_PROXY_SECRET: ${KAEDE_PROXY_SECRET:?set KAEDE_PROXY_SECRET}
  KAEDE_DATABASE_URL: ${KAEDE_DATABASE_URL:?set KAEDE_DATABASE_URL}
  KAEDE_DRAGONFLY_URL: ${KAEDE_DRAGONFLY_URL:?set KAEDE_DRAGONFLY_URL}
  KAEDE_GENERATED_OUTPUT: /frontend/src/lib/generated

services:
  preflight:
    <<: *backend-base
    restart: "no"
    # Bind mounts keep host ownership. Run this one-shot validator as the owner
    # of the deliberately mode-0600 operator file without adding capabilities.
    user: "${OPERATOR_ENV_UID:-1000}:${OPERATOR_ENV_GID:-1000}"
    env_file: *operator-environment-files
    environment:
      <<: *backend-environment
      ALLOW_NONPRODUCTION_DEPLOYMENT: ${ALLOW_NONPRODUCTION_DEPLOYMENT:-false}
      KAEDE_SERVICE_ROLE: preflight
      KAEDE_EDGE_SECRET: ${KAEDE_EDGE_SECRET:?set KAEDE_EDGE_SECRET}
      KAEDE_GATEWAY_SECRET_KEY: ${KAEDE_GATEWAY_SECRET_KEY:?set KAEDE_GATEWAY_SECRET_KEY}
      KAEDE_ADMIN_TOKEN: ${KAEDE_ADMIN_TOKEN:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DRAGONFLY_PASSWORD: ${DRAGONFLY_PASSWORD:?set DRAGONFLY_PASSWORD}
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
    volumes:
      - ${KAEDE_OPERATOR_ENV_FILE:-../.env}:/run/kaede/operator.env:ro
      - ./validate_deploy_env.py:/run/kaede/validate_deploy_env.py:ro
    command:
      [
        "sh",
        "-ec",
        "python /run/kaede/validate_deploy_env.py --file /run/kaede/operator.env && exec kaede preflight",
      ]

  voice-preflight:
    <<: *backend-base
    profiles: [voice]
    restart: "no"
    user: "${OPERATOR_ENV_UID:-1000}:${OPERATOR_ENV_GID:-1000}"
    env_file: *operator-environment-files
    environment:
      <<: *backend-environment
      ALLOW_NONPRODUCTION_DEPLOYMENT: ${ALLOW_NONPRODUCTION_DEPLOYMENT:-false}
      KAEDE_SERVICE_ROLE: preflight
      KAEDE_EDGE_SECRET: ${KAEDE_EDGE_SECRET:?set KAEDE_EDGE_SECRET}
      KAEDE_GATEWAY_SECRET_KEY: ${KAEDE_GATEWAY_SECRET_KEY:?set KAEDE_GATEWAY_SECRET_KEY}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DRAGONFLY_PASSWORD: ${DRAGONFLY_PASSWORD:?set DRAGONFLY_PASSWORD}
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_TURN_CERT_PATH: ${LIVEKIT_TURN_CERT_PATH:-/dev/null}
      LIVEKIT_TURN_KEY_PATH: ${LIVEKIT_TURN_KEY_PATH:-/dev/null}
      KAEDE_VOICE_ENABLED: ${KAEDE_VOICE_ENABLED:-false}
    volumes:
      - ${KAEDE_OPERATOR_ENV_FILE:-../.env}:/run/kaede/operator.env:ro
      - ./validate_deploy_env.py:/run/kaede/validate_deploy_env.py:ro
    command:
      [
        "sh",
        "-ec",
        "python /run/kaede/validate_deploy_env.py --file /run/kaede/operator.env && exec kaede preflight --voice",
      ]

  observability-preflight:
    <<: *backend-base
    profiles: [observability]
    restart: "no"
    user: "${OPERATOR_ENV_UID:-1000}:${OPERATOR_ENV_GID:-1000}"
    env_file: *operator-environment-files
    environment:
      <<: *backend-environment
      ALLOW_NONPRODUCTION_DEPLOYMENT: ${ALLOW_NONPRODUCTION_DEPLOYMENT:-false}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      KAEDE_SERVICE_ROLE: preflight
    volumes:
      - ${KAEDE_OPERATOR_ENV_FILE:-../.env}:/run/kaede/operator.env:ro
      - ./validate_deploy_env.py:/run/kaede/validate_deploy_env.py:ro
    command:
      [
        "python",
        "/run/kaede/validate_deploy_env.py",
        "--file",
        "/run/kaede/operator.env",
        "--observability",
      ]
    depends_on:
      preflight: { condition: service_completed_successfully }

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    ports: ["127.0.0.1:${KAEDE_CADDY_HOST_PORT:-18081}:80"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      KAEDE_DOMAIN: ${KAEDE_DOMAIN:?set KAEDE_DOMAIN}
      KAEDE_PROXY_SECRET: ${KAEDE_PROXY_SECRET:?set KAEDE_PROXY_SECRET}
      KAEDE_EDGE_SECRET: ${KAEDE_EDGE_SECRET:?set KAEDE_EDGE_SECRET}
      KAEDE_VOICE_ENABLED: ${KAEDE_VOICE_ENABLED:-false}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend-static:/srv/frontend:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge, egress]
    depends_on:
      api: { condition: service_healthy }
      gateway: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      frontend-build: { condition: service_completed_successfully }

  api:
    <<: *backend
    environment:
      <<: *backend-core-environment
      KAEDE_SERVICE_ROLE: api
      KAEDE_ADMIN_TOKEN: ${KAEDE_ADMIN_TOKEN:-}
    networks: [edge, data, egress]
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "${KAEDE_API_WORKERS:-4}",
        "--no-access-log",
      ]
    ports: ["127.0.0.1:${KAEDE_API_HOST_PORT:-18082}:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      dragonfly: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
      clamav: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 75s

  gateway:
    <<: *backend
    environment: *gateway-environment
    networks: [edge, data]
    command:
      [
        "uvicorn",
        "app.gateway:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        "--ws-max-size",
        "65536",
        "--no-access-log",
      ]
    deploy: { replicas: "${KAEDE_GATEWAY_WORKERS:-2}" }
    depends_on:
      postgres: { condition: service_healthy }
      dragonfly: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    <<: *backend
    environment:
      <<: *backend-environment
      KAEDE_SERVICE_ROLE: worker
    networks: [data, egress]
    command: ["taskiq", "worker", "app.tasks:broker"]
    depends_on:
      postgres: { condition: service_healthy }
      dragonfly: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
      clamav: { condition: service_healthy }

  scheduler:
    <<: *backend
    environment:
      KAEDE_LOG_LEVEL: ${KAEDE_LOG_LEVEL:-INFO}
      KAEDE_DRAGONFLY_URL: ${KAEDE_DRAGONFLY_URL:?set KAEDE_DRAGONFLY_URL}
    command: ["taskiq", "scheduler", "app.scheduler:scheduler"]

  migrate:
    <<: *backend-base
    environment:
      <<: *backend-core-environment
      KAEDE_SERVICE_ROLE: migration
    restart: "no"
    command: ["sh", "-ec", "alembic upgrade head && kaede bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy

  postgres:
    image: postgres:16.14-alpine
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    environment:
      POSTGRES_DB: kaede
      POSTGRES_USER: kaede
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [data]
    depends_on:
      preflight: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaede -d kaede"]
      interval: 5s
      timeout: 3s
      retries: 20

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.39.0
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    command:
      [
        "--dir=/data",
        "--dbfilename=dump",
        "--snapshot_cron=*/5 * * * *",
        "--requirepass=${DRAGONFLY_PASSWORD:?set DRAGONFLY_PASSWORD}",
      ]
    environment:
      REDISCLI_AUTH: ${DRAGONFLY_PASSWORD:?set DRAGONFLY_PASSWORD}
    volumes: [dragonfly-data:/data]
    networks: [data]
    depends_on:
      preflight: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-not-configured}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-not-configured}
      GARAGE_DEFAULT_ACCESS_KEY: ${KAEDE_MEDIA_S3_ACCESS_KEY:?set KAEDE_MEDIA_S3_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${KAEDE_MEDIA_S3_SECRET_KEY:?set KAEDE_MEDIA_S3_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${KAEDE_MEDIA_ATTACHMENTS_BUCKET:-kaede-attachments}
      GARAGE_RPC_PUBLIC_ADDR: garage:3901
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    networks: [edge, data]
    depends_on:
      preflight: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 20

  storage-init:
    build:
      context: ../backend
      target: runtime
    restart: "no"
    security_opt: [no-new-privileges:true]
    command: ["python", "-m", "app.media.init_buckets"]
    environment:
      <<: *backend-environment
      KAEDE_SERVICE_ROLE: preflight
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    networks: [data, egress]
    depends_on:
      preflight: { condition: service_completed_successfully }

  clamav:
    image: clamav/clamav:1.5.3
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    volumes: [clamav-data:/var/lib/clamav]
    networks: [data, egress]
    depends_on:
      preflight: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20

  livekit:
    image: livekit/livekit-server:v1.13.3
    profiles: [voice]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    network_mode: host
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses: ["0.0.0.0"]
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        turn:
          enabled: true
          domain: "${KAEDE_DOMAIN:?set KAEDE_DOMAIN}"
          udp_port: ${KAEDE_TURN_UDP_PORT:-13478}
          tls_port: 5349
          cert_file: /run/secrets/livekit-turn-cert.pem
          key_file: /run/secrets/livekit-turn-key.pem
        keys:
          "${LIVEKIT_API_KEY:-}": "${LIVEKIT_API_SECRET:-}"
        webhook:
          api_key: "${LIVEKIT_API_KEY:-}"
          urls: ["http://127.0.0.1:${KAEDE_API_HOST_PORT:-18082}/internal/livekit/webhook"]
        room:
          empty_timeout: 300
    volumes:
      - ${LIVEKIT_TURN_CERT_PATH:-/dev/null}:/run/secrets/livekit-turn-cert.pem:ro
      - ${LIVEKIT_TURN_KEY_PATH:-/dev/null}:/run/secrets/livekit-turn-key.pem:ro
    depends_on:
      voice-preflight: { condition: service_completed_successfully }

  livekit-validation:
    image: livekit/livekit-server:v1.13.3
    profiles: [validation]
    restart: "no"
    security_opt: [no-new-privileges:true]
    networks: [data]
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses: ["0.0.0.0"]
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
        keys:
          "LKvoicevalidation": "voice-validation-secret-000000000000000000000000"
        room:
          empty_timeout: 60

  voice-check:
    <<: *backend-dev
    profiles: [validation]
    environment:
      <<: *validation-environment
      KAEDE_VOICE_ENABLED: "true"
      KAEDE_VOICE_PUBLIC_URL: ws://livekit-validation:7880
      KAEDE_VOICE_LIVEKIT_URL: http://livekit-validation:7880
      KAEDE_VOICE_API_KEY: LKvoicevalidation
      KAEDE_VOICE_API_SECRET: voice-validation-secret-000000000000000000000000
    command: ["python", "-m", "scripts.verify_voice"]

  release-check:
    <<: *backend-dev
    profiles: [validation]
    environment: *validation-environment
    command:
      - sh
      - -ec
      - >-
        alembic upgrade head &&
        kaede bootstrap &&
        python -m scripts.verify_release

  frontend-build:
    build:
      context: ../frontend
      target: build
      args:
        KAEDE_MEDIA_PUBLIC_BASE_URL: ${KAEDE_MEDIA_PUBLIC_BASE_URL:-https://media.${KAEDE_DOMAIN:?set KAEDE_DOMAIN}}
        KAEDE_MEDIA_S3_ADDRESSING_STYLE: ${KAEDE_MEDIA_S3_ADDRESSING_STYLE:-path}
        KAEDE_MEDIA_ATTACHMENTS_BUCKET: ${KAEDE_MEDIA_ATTACHMENTS_BUCKET:-kaede-attachments}
    restart: "no"
    user: "0:0"
    network_mode: none
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    cap_drop: [ALL]
    command:
      - sh
      - -ec
      - |
        release="release-$$(date +%s%N)-$$$$"
        previous_release="$$(readlink /static/current 2>/dev/null || true)"
        mkdir -p "/static/releases/$$release"
        cp -R build/. "/static/releases/$$release/"
        rm -f /static/.current-new
        ln -s "releases/$$release" /static/.current-new
        mv -Tf /static/.current-new /static/current
        if [ -n "$$previous_release" ]; then
          find /static/releases -mindepth 1 -maxdepth 1 -type d \
            ! -name "$$release" ! -path "/static/$$previous_release" -exec rm -rf {} +
        else
          find /static/releases -mindepth 1 -maxdepth 1 -type d \
            ! -name "$$release" -exec rm -rf {} +
        fi
    volumes: [frontend-static:/static]

  backend-check:
    <<: *backend-dev
    profiles: [validation]
    environment: *validation-environment
    networks: [data, egress]
    volumes:
      - "../backend:/workspace"
      - "../frontend:/frontend:ro"
      - "../.env.example:/repository/.env.example:ro"
      - "../.env.s3.example:/repository/.env.s3.example:ro"
      - "./reference.env.example:/repository/deploy/reference.env.example:ro"
      - "./.env.alpha:/repository/deploy/.env.alpha:ro"
      - "./.env.beta:/repository/deploy/.env.beta:ro"
      - "./.env.schema:/repository/deploy/.env.schema:ro"
      - "./nginx:/repository/deploy/nginx:ro"
    command: ["sh", "-ec", "ruff check . && ruff format --check . && mypy app scripts && pytest"]

  backend-test:
    <<: *backend-dev
    profiles: [validation]
    environment: *validation-environment
    volumes:
      - "../backend:/workspace"
      - "../frontend:/frontend:ro"
      - "../.env.example:/repository/.env.example:ro"
      - "../.env.s3.example:/repository/.env.s3.example:ro"
      - "./reference.env.example:/repository/deploy/reference.env.example:ro"
      - "./.env.alpha:/repository/deploy/.env.alpha:ro"
      - "./.env.beta:/repository/deploy/.env.beta:ro"
      - "./.env.schema:/repository/deploy/.env.schema:ro"
      - "./nginx:/repository/deploy/nginx:ro"
    command: ["pytest", "--cov=app", "--cov-report=term-missing"]

  frontend-check:
    build: { context: ../frontend, target: development }
    profiles: [validation]
    logging: *default-logging
    command: ["sh", "-ec", "pnpm lint && pnpm check && pnpm test && pnpm build && pnpm check:csp"]
    environment:
      KAEDE_MEDIA_PUBLIC_BASE_URL: ${KAEDE_MEDIA_PUBLIC_BASE_URL:-http://media.schema.localhost}
      KAEDE_MEDIA_S3_ADDRESSING_STYLE: ${KAEDE_MEDIA_S3_ADDRESSING_STYLE:-path}
      KAEDE_MEDIA_ATTACHMENTS_BUCKET: ${KAEDE_MEDIA_ATTACHMENTS_BUCKET:-kaede-attachments}
    networks: [data, egress]
    volumes: ["../deploy:/deploy:ro"]

  frontend-test:
    build: { context: ../frontend, target: development }
    profiles: [validation]
    logging: *default-logging
    command: ["sh", "-ec", "pnpm exec svelte-kit sync && pnpm test"]
    networks: [data]

  migration-check:
    <<: *backend-dev
    profiles: [validation]
    environment: *validation-environment
    command:
      - sh
      - -ec
      - >-
        alembic upgrade head &&
        python -m scripts.verify_schema &&
        alembic downgrade b46d9a1f2c73 &&
        python -m scripts.verify_migration_guards prepare-federation &&
        if downgrade_output="$$(alembic downgrade a35c8d2e7f41 2>&1)"; then
          echo 'unsafe federation-event downgrade unexpectedly succeeded' >&2;
          exit 1;
        fi &&
        case "$$downgrade_output" in
          *'cannot downgrade: federation event IDs collide across origins'*) ;;
          *) printf '%s\n' "$$downgrade_output" >&2; exit 1 ;;
        esac &&
        python -m scripts.verify_migration_guards verify-federation &&
        python -m scripts.verify_migration_guards cleanup-federation &&
        python -m scripts.verify_migration_guards prepare-guild &&
        if downgrade_output="$$(alembic downgrade a35c8d2e7f41 2>&1)"; then
          echo 'unsafe guild-event downgrade unexpectedly succeeded' >&2;
          exit 1;
        fi &&
        case "$$downgrade_output" in
          *'cannot downgrade: guild event IDs collide across guild domains'*) ;;
          *) printf '%s\n' "$$downgrade_output" >&2; exit 1 ;;
        esac &&
        python -m scripts.verify_migration_guards verify-guild &&
        python -m scripts.verify_migration_guards cleanup-guild &&
        alembic upgrade head &&
        alembic downgrade base &&
        alembic upgrade head &&
        alembic check

  identity-check:
    <<: *backend-dev
    profiles: [validation]
    environment: *validation-environment
    command:
      - sh
      - -ec
      - >-
        alembic upgrade head &&
        kaede bootstrap &&
        python -m scripts.verify_identity

  chat-check:
    <<: *backend-dev
    profiles: [validation]
    environment: *validation-environment
    command:
      - sh
      - -ec
      - >-
        alembic upgrade head &&
        kaede bootstrap &&
        python -m scripts.verify_chat

  media-check:
    <<: *backend-dev
    profiles: [validation]
    environment: *backend-environment
    command:
      - sh
      - -ec
      - >-
        alembic upgrade head &&
        kaede bootstrap &&
        python -m scripts.verify_media

  prometheus:
    image: prom/prometheus:v3.13.1
    profiles: [observability]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    read_only: true
    cap_drop: [ALL]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [data, observability]
    depends_on:
      observability-preflight: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 12

  grafana:
    image: grafana/grafana:13.1.0
    profiles: [observability]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports: ["127.0.0.1:${KAEDE_GRAFANA_HOST_PORT:-18084}:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [observability]
    depends_on:
      observability-preflight: { condition: service_completed_successfully }
      prometheus: { condition: service_healthy }
      loki: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12

  loki:
    image: grafana/loki:3.7.3
    profiles: [observability]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *default-logging
    command: ["-config.file=/etc/loki/local-config.yaml"]
    networks: [observability]
    depends_on:
      observability-preflight: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 3s
      retries: 12

networks:
  edge: { driver: bridge, internal: true }
  data: { driver: bridge, internal: true }
  egress: { driver: bridge }
  observability: { driver: bridge, internal: true }

volumes:
  postgres-data:
  dragonfly-data:
  garage-meta:
  garage-data:
  clamav-data:
  frontend-static:
  caddy-data:
  caddy-config:
  grafana-data:
  prometheus-data:
