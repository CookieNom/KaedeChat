map $http_upgrade $kaede_connection_upgrade {
    default upgrade;
    '' close;
}

limit_conn_zone $binary_remote_addr zone=kaede_federation_connections:1m;
limit_req_zone $binary_remote_addr zone=kaede_federation_upgrades:1m rate=20r/s;

upstream alpha_caddy { server alpha-caddy:80; keepalive 8; }
upstream beta_caddy { server beta-caddy:80; keepalive 8; }

server {
    listen 443 ssl;
    server_name alpha.localhost;
    ssl_certificate /tls/edge.crt;
    ssl_certificate_key /tls/edge.key;
    location = /_kaede/v1/link {
        limit_conn kaede_federation_connections 8;
        limit_req zone=kaede_federation_upgrades burst=20 nodelay;
        proxy_pass http://alpha_caddy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Kaede-Edge-Secret kaede-validation-edge-secret-0001;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kaede_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://alpha_caddy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Kaede-Edge-Secret kaede-validation-edge-secret-0001;
        proxy_set_header Connection "";
    }
}

server {
    listen 443 ssl;
    server_name beta.localhost;
    ssl_certificate /tls/edge.crt;
    ssl_certificate_key /tls/edge.key;
    location = /_kaede/v1/link {
        limit_conn kaede_federation_connections 8;
        limit_req zone=kaede_federation_upgrades burst=20 nodelay;
        proxy_pass http://beta_caddy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Kaede-Edge-Secret kaede-validation-edge-secret-0001;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kaede_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://beta_caddy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Kaede-Edge-Secret kaede-validation-edge-secret-0001;
        proxy_set_header Connection "";
    }
}
