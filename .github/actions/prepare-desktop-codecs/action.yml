name: Prepare desktop codecs
description: Restore and verify the matching HEVC WebRTC archive, patched SDK, and CUDA headers.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.13.15"
    - uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4
      with:
        version: "1.4.0"
    - name: Pull pinned WebRTC
      shell: bash
      env:
        DOCKER_CONFIG: ${{ runner.temp }}/kaede-webrtc-registry
        GH_TOKEN: ${{ github.token }}
      run: |
        trap 'rm -f "$DOCKER_CONFIG/config.json"' EXIT
        printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        python desktop/tool/webrtc_registry.py pull
    - name: Prepare SDK and codec environment
      shell: bash
      run: |
        python desktop/tool/prepare_codecs.py --cuda --artifact desktop/native/webrtc --github-env
