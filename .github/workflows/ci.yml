name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults: { run: { working-directory: backend } }
    env:
      KAEDE_DOMAIN: ci.localhost
      KAEDE_ENVIRONMENT: test
      KAEDE_SECRET_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
      KAEDE_DATABASE_URL: postgresql+asyncpg://kaede:kaede@127.0.0.1:5432/kaede
      KAEDE_DRAGONFLY_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with: { version: "0.11.8", enable-cache: true }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.12.13" }
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app scripts
      - run: uv run pytest --cov=app
      - run: uv run pip-audit --skip-editable
      - name: Verify generated protocol constants
        run: uv run python -m scripts.generate_protocol && git diff --exit-code -- ../frontend/src/lib/generated ../desktop/crates/kaede-protocol/src/generated.rs

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KAEDE_MEDIA_PUBLIC_BASE_URL: https://media.ci.localhost
      KAEDE_MEDIA_S3_ADDRESSING_STYLE: path
      KAEDE_MEDIA_ATTACHMENTS_BUCKET: kaede-attachments
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with: { version: "10.34.0", run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22.23.1", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:csp
      - run: pnpm audit --audit-level=moderate

  desktop-portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake file libasound2-dev libayatana-appindicator3-dev libdbus-1-dev libgtk-3-dev librsvg2-dev libssl-dev libudev-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf pkg-config wget
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with: { version: "10.34.0", run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22.23.1", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal
      - name: Cache Cargo artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: desktop-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
      - run: make desktop-check
      - run: make desktop-lint
      - run: make desktop-test

  desktop-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake file libasound2-dev libayatana-appindicator3-dev libdbus-1-dev libgtk-3-dev librsvg2-dev libssl-dev libudev-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf pkg-config wget
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with: { version: "10.34.0", run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22.23.1", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal
      - name: Check native desktop stack
        run: cargo +1.92.0 check --locked --manifest-path desktop/Cargo.toml -p kaede-tauri
      - name: Test native audio and capture boundaries
        if: runner.os == 'Linux'
        run: cargo +1.92.0 test --locked --manifest-path desktop/Cargo.toml -p kaede-audio -p kaede-capture

  migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.14-alpine
        env: { POSTGRES_DB: kaede, POSTGRES_USER: kaede, POSTGRES_PASSWORD: kaede }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kaede" --health-interval 5s
          --health-timeout 3s --health-retries 20
    defaults: { run: { working-directory: backend } }
    env:
      KAEDE_DOMAIN: ci.localhost
      KAEDE_ENVIRONMENT: test
      KAEDE_SECRET_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
      KAEDE_DATABASE_URL: postgresql+asyncpg://kaede:kaede@127.0.0.1:5432/kaede
      KAEDE_DRAGONFLY_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with: { version: "0.11.8", enable-cache: true }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.12.13" }
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run python -m scripts.verify_schema
      - run: uv run alembic downgrade b46d9a1f2c73
      - run: uv run python -m scripts.verify_migration_guards prepare-federation
      - name: Verify origin-scoped federation events block an unsafe downgrade
        run: |
          if downgrade_output="$(uv run alembic downgrade a35c8d2e7f41 2>&1)"; then
            echo "unsafe federation-event downgrade unexpectedly succeeded" >&2
            exit 1
          fi
          case "$downgrade_output" in
            *"cannot downgrade: federation event IDs collide across origins"*) ;;
            *) printf '%s\n' "$downgrade_output" >&2; exit 1 ;;
          esac
      - run: uv run python -m scripts.verify_migration_guards verify-federation
      - run: uv run python -m scripts.verify_migration_guards cleanup-federation
      - run: uv run python -m scripts.verify_migration_guards prepare-guild
      - name: Verify origin-scoped guild events block an unsafe downgrade
        run: |
          if downgrade_output="$(uv run alembic downgrade a35c8d2e7f41 2>&1)"; then
            echo "unsafe guild-event downgrade unexpectedly succeeded" >&2
            exit 1
          fi
          case "$downgrade_output" in
            *"cannot downgrade: guild event IDs collide across guild domains"*) ;;
            *) printf '%s\n' "$downgrade_output" >&2; exit 1 ;;
          esac
      - run: uv run python -m scripts.verify_migration_guards verify-guild
      - run: uv run python -m scripts.verify_migration_guards cleanup-guild
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
      - run: uv run alembic check

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: make compose-check

  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: make identity-check

  chat:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: make chat-check

  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: make media-check

  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: make voice-check

  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: make release-check

  federation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: make federation-check

  federation-tls:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: make federation-tls-check
