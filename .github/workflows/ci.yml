name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Reusable release CI has a different workflow name and tag ref from main CI.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  FLUTTER_VERSION: "3.41.4"
  RUST_VERSION: "1.97.1"

jobs:
  release-inputs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.12.13" }
      - run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Check release inputs
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            python .github/scripts/check-release-inputs.py --stamp --tag "$GITHUB_REF_NAME"
          else
            python .github/scripts/check-release-inputs.py
          fi
      - name: Validate workflow syntax
        if: runner.os == 'Linux'
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color -shellcheck= -pyflakes=

  backend:
    needs: release-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults: { run: { working-directory: backend } }
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      KAEDE_DOMAIN: ci.localhost
      KAEDE_ENVIRONMENT: test
      KAEDE_SECRET_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
      KAEDE_DATABASE_URL: postgresql+asyncpg://kaede:kaede@127.0.0.1:5432/kaede
      KAEDE_DRAGONFLY_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with: { version: "0.11.8", enable-cache: true }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.12.13" }
      - name: Install backend native dependencies
        run: sudo apt-get update && sudo apt-get install -y libvips42
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app scripts
      - run: uv run pytest --cov=app
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
      - name: Test Python SDK with the locked backend test dependencies
        env:
          PYTHONPATH: ../sdk/python
        run: uv run pytest -q -o asyncio_mode=auto ../sdk/python/tests
      - run: uv run pip-audit --skip-editable
      - name: Verify generated protocol constants
        run: uv run python -m scripts.generate_protocol && git diff --exit-code -- ../frontend/src/lib/generated ../desktop/crates/kaede-protocol/src/generated.rs ../mobile/lib/src/protocol/generated.dart ../deploy/validate_deploy_env.py ../setup.sh

  mobile:
    needs: release-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install pinned Flutter SDK
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git flutter
          echo "${{ runner.temp }}/flutter/bin" >> "$GITHUB_PATH"
      - name: Cache pinned Flutter runtime artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/flutter/bin/cache
          key: flutter-android-v1-${{ runner.os }}-${{ env.FLUTTER_VERSION }}
      - name: Cache Dart packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.pub-cache/hosted
            ~/.pub-cache/git
          key: dart-pub-v1-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('mobile/pubspec.lock') }}
      - name: Validate mobile before installing native build dependencies
        working-directory: ${{ github.workspace }}
        run: make mobile-check
      - name: Install pinned Rust Android targets
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup target add --toolchain "$RUST_VERSION" \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android
      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: cargo-download-v1-rust-${{ env.RUST_VERSION }}-${{ hashFiles('desktop/Cargo.lock') }}
          enableCrossOsArchive: true
      - name: Cache Android dependency downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches/modules-2/files-2.1
            ~/.gradle/caches/modules-2/metadata-*
            ~/.gradle/wrapper/dists
          key: gradle-download-v1-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('mobile/pubspec.lock', 'mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
      - run: flutter build apk --debug
      - name: Enforce mobile cache size budgets
        if: always()
        working-directory: ${{ github.workspace }}
        shell: bash
        run: bash .github/scripts/enforce-cache-budgets.sh mobile

  mobile-ios:
    needs: release-inputs
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      COCOAPODS_VERSION: "1.16.2"
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Verify release iOS SDK
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          (( ${sdk_version%%.*} >= 26 ))
      - name: Install pinned Flutter SDK
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git flutter
          echo "${{ runner.temp }}/flutter/bin" >> "$GITHUB_PATH"
      - name: Install pinned CocoaPods
        run: |
          gem_home="$RUNNER_TEMP/cocoapods-gems"
          GEM_HOME="$gem_home" GEM_PATH="$gem_home" gem install cocoapods --version "$COCOAPODS_VERSION" --no-document
          echo "GEM_HOME=$gem_home" >> "$GITHUB_ENV"
          echo "GEM_PATH=$gem_home" >> "$GITHUB_ENV"
          echo "$gem_home/bin" >> "$GITHUB_PATH"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Build unsigned iOS release
        run: |
          flutter pub get --enforce-lockfile
          flutter precache --ios
          ./tool/build_e2ee_native.sh --ios
          pod install --deployment --project-directory=ios
          # The Xcode project bundles this file. CI needs a resource, not Firebase credentials.
          python3 - <<'PYTHON'
          import plistlib
          from pathlib import Path
          Path("ios/Runner/GoogleService-Info.plist").write_bytes(plistlib.dumps({"BUNDLE_ID": "chat.kaede.mobile"}))
          PYTHON
          flutter build ios --release --no-codesign
          git diff --exit-code -- pubspec.lock ios/Podfile.lock

  frontend:
    needs: release-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KAEDE_MEDIA_PUBLIC_BASE_URL: https://media.ci.localhost
      KAEDE_MEDIA_S3_ADDRESSING_STYLE: path
      KAEDE_MEDIA_ATTACHMENTS_BUCKET: kaede-attachments
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with: { version: "10.34.0", run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22.23.1", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:livekit-crypto
      - run: pnpm check:e2ee-wasm
      - run: pnpm build
      - run: pnpm check:csp
      - run: pnpm audit --audit-level=moderate

  desktop-portable:
    needs: release-inputs
    runs-on: ubuntu-24.04
    # A dependency-lock change causes a cold build of the full native stack.
    # Keep this above the release Linux build's cold-cache duration.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake file libasound2-dev libayatana-appindicator3-dev libdbus-1-dev libgtk-3-dev librsvg2-dev libssl-dev libudev-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf pkg-config wget
      - name: Install Clang 21 for libwebrtc
        if: runner.os == 'Linux'
        run: |
          sudo sh desktop/install-clang.sh
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with: { version: "10.34.0", run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22.23.1", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup component add --toolchain "$RUST_VERSION" rustfmt clippy
      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: cargo-download-v1-rust-${{ env.RUST_VERSION }}-${{ hashFiles('desktop/Cargo.lock') }}
          enableCrossOsArchive: true
      - run: make desktop-check
      - run: make desktop-lint
      - run: make desktop-test
      - name: Enforce Cargo cache size budget
        if: always()
        run: bash .github/scripts/enforce-cache-budgets.sh cargo

  desktop-native:
    needs: release-inputs
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake file libasound2-dev libayatana-appindicator3-dev libdbus-1-dev libgtk-3-dev librsvg2-dev libssl-dev libudev-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf pkg-config wget
      - name: Install Clang 21 for libwebrtc
        if: runner.os == 'Linux'
        run: |
          sudo sh desktop/install-clang.sh
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with: { version: "10.34.0", run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22.23.1", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: cargo-download-v1-rust-${{ env.RUST_VERSION }}-${{ hashFiles('desktop/Cargo.lock') }}
          enableCrossOsArchive: true
      - name: Check native desktop stack
        if: runner.os != 'Windows'
        run: cargo +1.97.1 check --locked --manifest-path desktop/Cargo.toml -p kaede-tauri
      - name: Link Windows release with the shipping CRT configuration
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo +1.97.1 build --release --locked --manifest-path desktop/Cargo.toml -p kaede-tauri
      - name: Test native audio, capture, and Tauri boundaries
        if: runner.os == 'Linux'
        run: cargo +1.97.1 test --locked --manifest-path desktop/Cargo.toml -p kaede-audio -p kaede-capture -p kaede-tauri
      - name: Enforce Cargo cache size budget
        if: always()
        shell: bash
        run: bash .github/scripts/enforce-cache-budgets.sh cargo

  migrations:
    needs: release-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.14-alpine
        env: { POSTGRES_DB: kaede, POSTGRES_USER: kaede, POSTGRES_PASSWORD: kaede }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kaede" --health-interval 5s
          --health-timeout 3s --health-retries 20
    defaults: { run: { working-directory: backend } }
    env:
      KAEDE_DOMAIN: ci.localhost
      KAEDE_ENVIRONMENT: test
      KAEDE_SECRET_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
      KAEDE_DATABASE_URL: postgresql+asyncpg://kaede:kaede@127.0.0.1:5432/kaede
      KAEDE_DRAGONFLY_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with: { version: "0.11.8", enable-cache: true }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.12.13" }
      - name: Install backend native dependencies
        run: sudo apt-get update && sudo apt-get install -y libvips42
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run python -m scripts.verify_schema
      - run: uv run alembic downgrade b46d9a1f2c73
      - run: uv run python -m scripts.verify_migration_guards prepare-federation
      - name: Verify origin-scoped federation events block an unsafe downgrade
        run: |
          if downgrade_output="$(uv run alembic downgrade a35c8d2e7f41 2>&1)"; then
            echo "unsafe federation-event downgrade unexpectedly succeeded" >&2
            exit 1
          fi
          case "$downgrade_output" in
            *"cannot downgrade: federation event IDs collide across origins"*) ;;
            *) printf '%s\n' "$downgrade_output" >&2; exit 1 ;;
          esac
      - run: uv run python -m scripts.verify_migration_guards verify-federation
      - run: uv run python -m scripts.verify_migration_guards cleanup-federation
      - run: uv run python -m scripts.verify_migration_guards prepare-guild
      - name: Verify origin-scoped guild events block an unsafe downgrade
        run: |
          if downgrade_output="$(uv run alembic downgrade a35c8d2e7f41 2>&1)"; then
            echo "unsafe guild-event downgrade unexpectedly succeeded" >&2
            exit 1
          fi
          case "$downgrade_output" in
            *"cannot downgrade: guild event IDs collide across guild domains"*) ;;
            *) printf '%s\n' "$downgrade_output" >&2; exit 1 ;;
          esac
      - run: uv run python -m scripts.verify_migration_guards verify-guild
      - run: uv run python -m scripts.verify_migration_guards cleanup-guild
      - run: uv run python -m scripts.verify_migration_guards prepare-thread-permissions
      - run: uv run alembic upgrade head
      - run: uv run python -m scripts.verify_migration_guards verify-thread-permissions
      - run: uv run python -m scripts.verify_migration_guards cleanup-thread-permissions
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
      - name: Exercise PostgreSQL contracts against the migrated disposable database
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://kaede:kaede@127.0.0.1:5432/kaede
        run: uv run pytest -q -m postgres
      - run: uv run alembic check

  compose:
    needs: release-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.12.13" }
      - run: make compose-check
      - run: make auto-update-check

  identity:
    needs: release-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: make identity-check

  chat:
    needs: release-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: make chat-check

  media:
    needs: release-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: make media-check

  voice:
    needs: release-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: make voice-check

  release:
    needs: release-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: make release-check

  federation:
    needs: release-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: make federation-check

  federation-tls:
    needs: release-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: make federation-tls-check
