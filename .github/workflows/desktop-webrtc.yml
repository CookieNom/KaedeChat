name: Publish desktop WebRTC

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/desktop-webrtc.yml
      - desktop/tool/build_webrtc.py
      - desktop/tool/codec_sources.json
      - desktop/tool/prepare_codecs.py
      - desktop/tool/webrtc_packages.json
      - desktop/tool/webrtc_registry.py
      - desktop/patches/*.patch
      - docs/av1-e2ee/native-interop.patch

permissions:
  contents: read

jobs:
  publish:
    if: github.ref_type == 'branch'
    permissions:
      actions: read
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    concurrency:
      group: desktop-webrtc-publish-${{ matrix.os }}
      cancel-in-progress: false
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.15"
      - uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4
        with:
          version: 1.4.0
      - name: Sign in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Check for the matching WebRTC package
        id: plan
        run: python desktop/tool/webrtc_registry.py plan
      - name: Publish the verified archive from the previous build
        if: steps.plan.outputs.mode == 'seed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python desktop/tool/webrtc_registry.py seed
          python desktop/tool/webrtc_registry.py pull
      - name: Linux build dependencies
        if: steps.plan.outputs.mode == 'build' && runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo bash "$GITHUB_WORKSPACE/.github/scripts/update-runner-apt.sh"
          sudo apt-get install -y ninja-build pkg-config cpio rsync unzip xz-utils libglib2.0-dev libasound2-dev libpulse-dev libgbm-dev libudev-dev libxrandr-dev libxdamage-dev libxcomposite-dev libxfixes-dev libxext-dev libx11-dev
      - name: Select Xcode
        if: steps.plan.outputs.mode == 'build' && runner.os == 'macOS'
        working-directory: desktop/tool
        run: |
          version="$(python -c 'from prepare_codecs import XCODE_VERSION; print(XCODE_VERSION)')"
          sudo xcode-select -s "/Applications/Xcode_${version}.app/Contents/Developer"
      - name: Build custom WebRTC
        if: steps.plan.outputs.mode == 'build'
        run: python desktop/tool/build_webrtc.py --work-dir "$RUNNER_TEMP/kaede-desktop-webrtc"
      - name: Verify and publish the new WebRTC package
        if: steps.plan.outputs.mode == 'build'
        run: python desktop/tool/webrtc_registry.py publish
