name: Python encrypted voice interoperability

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths: &voice-inputs
      - 'sdk/python/kaede_bot/voice.py'
      - 'sdk/python/pyproject.toml'
      - 'sdk/python/uv.lock'
      - 'sdk/python/tools/**'
      - 'docs/av1-e2ee/bot_interop.*'
      - 'docs/av1-e2ee/interop.py'
      - 'frontend/patches/livekit-client*'
      - 'frontend/pnpm-lock.yaml'
      - 'frontend/src/lib/voice/session.ts'
      - 'desktop/install-clang.sh'
      - '.github/workflows/bot-voice-interop.yml'
  push:
    branches: [main]
    paths: *voice-inputs

permissions:
  contents: read

jobs:
  interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      RUSTUP_TOOLCHAIN: '1.97.1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with: { version: '0.11.8', enable-cache: true }
      - name: Restore tested FFI for branch checks
        if: "!startsWith(github.ref, 'refs/tags/')"
        id: native
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/kaede-bot-ffi
          key: bot-ffi-v1-ubuntu-24.04-x64-${{ hashFiles('sdk/python/tools/**', 'desktop/install-clang.sh', '.github/workflows/bot-voice-interop.yml') }}
      - name: Prepare Linux native dependencies
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          sudo bash "$GITHUB_WORKSPACE/.github/scripts/update-runner-apt.sh"
          sudo sh desktop/install-clang.sh
          sudo apt-get install -y cmake protobuf-compiler pkg-config libc++-21-dev libc++abi-21-dev libglib2.0-dev libssl-dev libasound2-dev libx11-dev libxext-dev libxfixes-dev libxrandr-dev libxdamage-dev libxcomposite-dev libgl-dev libdrm-dev libgbm-dev libxkbcommon-dev
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Build Kaede's pinned Python FFI
        if: steps.native.outputs.cache-hit != 'true'
        env: { CC: clang-21, CXX: clang++-21 }
        run: |
          python3 sdk/python/tools/build_livekit_ffi.py --work-dir "$RUNNER_TEMP/kaede-bot-build" --output "$RUNNER_TEMP/kaede-bot-ffi"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with: { version: "10.34.0", run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22.23.1", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Install the locked bot transport and test browser
        run: |
          uv sync --project sdk/python --locked --python 3.11 --extra voice
          uv pip install --python sdk/python/.venv/bin/python 'playwright==1.58.0'
          sdk/python/.venv/bin/python -m playwright install --with-deps chromium
      - name: Exchange encrypted audio and video before and after rotation
        env:
          LIVEKIT_LIB_PATH: ${{ runner.temp }}/kaede-bot-ffi/liblivekit_ffi.so
        run: |
          docker run -d --rm --network host --name kaede-bot-test-sfu livekit/livekit-server:v1.13.3 \
            --dev --bind 127.0.0.1 --node-ip 127.0.0.1 --port 17880 --rtc.tcp_port 17881 \
            --udp-port 17882 --rtc.enable_loopback_candidate
          trap 'docker stop kaede-bot-test-sfu' EXIT
          curl --fail --silent --retry 12 --retry-connrefused --retry-delay 1 http://127.0.0.1:17880/
          sdk/python/.venv/bin/python docs/av1-e2ee/bot_interop.py
      - name: Package the tested native library
        run: |
          mkdir "$RUNNER_TEMP/kaede-bot-artifact"
          cd "$RUNNER_TEMP/kaede-bot-artifact"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -czf kaede-bot-voice-linux-x86_64.tar.gz -C "$RUNNER_TEMP/kaede-bot-ffi" .
          sha256sum kaede-bot-voice-linux-x86_64.tar.gz > kaede-bot-voice-linux-x86_64.tar.gz.sha256
      - uses: ./.github/actions/upload-artifact
        with:
          name: kaede-bot-voice-linux-x86_64
          path: ${{ runner.temp }}/kaede-bot-artifact/*
          if-no-files-found: error
