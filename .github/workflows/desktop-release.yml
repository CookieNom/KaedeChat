name: Client release

on:
  push:
    tags:
      - "v*"
      - "desktop-v*"

permissions:
  contents: read

concurrency:
  group: client-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  NODE_VERSION: "22.23.1"
  PNPM_VERSION: "10.34.0"
  RUST_VERSION: "1.97.1"
  TAURI_CLI_VERSION: "2.11.4"
  FLUTTER_VERSION: "3.41.4"
  COCOAPODS_VERSION: "1.16.2"

jobs:
  preflight:
    name: Validate tag and select changed clients
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.changes.outputs.desktop }}
      android: ${{ steps.changes.outputs.android }}
      ios: ${{ steps.changes.outputs.ios }}
      desktop_base: ${{ steps.changes.outputs.desktop_base }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.13.15" }
      - run: python .github/scripts/check-release-inputs.py --stamp --tag "$GITHUB_REF_NAME"
      - name: Compare each client with its last published build
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/client-releases.json"
          python .github/scripts/select-client-releases.py \
            --releases "$RUNNER_TEMP/client-releases.json" --tag "$GITHUB_REF_NAME"

  ci:
    name: Release CI
    needs: preflight
    uses: ./.github/workflows/ci.yml

  desktop-linux:
    needs: [preflight, ci]
    if: needs.preflight.outputs.desktop == 'true'
    name: Linux desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.13.15" }
      - name: Set client versions from release tag
        shell: bash
        run: python .github/scripts/check-release-inputs.py --stamp --tag "$GITHUB_REF_NAME"
      - name: Install Linux desktop dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          cmake file libasound2-dev libayatana-appindicator3-dev
          libdbus-1-dev libgtk-3-dev librsvg2-dev libssl-dev libudev-dev
          libwebkit2gtk-4.1-dev libxdo-dev patchelf pkg-config wget
      - name: Install Clang 21 for libwebrtc
        run: |
          sudo sh desktop/install-clang.sh
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: cargo-download-v1-rust-${{ env.RUST_VERSION }}-${{ hashFiles('desktop/Cargo.lock') }}
          enableCrossOsArchive: true
      - name: Build embedded frontend
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build
      - name: Cache pinned Tauri CLI
        id: tauri-cli-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: cargo-tauri-cli-v1-${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_VERSION }}-tauri-${{ env.TAURI_CLI_VERSION }}
      - name: Install pinned Tauri CLI
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo +"$RUST_VERSION" install tauri-cli --version "$TAURI_CLI_VERSION" --locked
      - name: Verify pinned Tauri CLI
        run: |
          version_output="$(cargo +"$RUST_VERSION" tauri --version)"
          printf '%s\n' "$version_output"
          case "$version_output" in
            *"$TAURI_CLI_VERSION"*) ;;
            *) echo "unexpected Tauri CLI version" >&2; exit 1 ;;
          esac
      - name: Build Linux packages
        working-directory: desktop/tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          cargo +"$RUST_VERSION" tauri build \
            --config src-tauri/tauri.conf.json \
            --bundles appimage,deb -- --locked
      - name: Collect Linux release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          while IFS= read -r -d '' file; do
            case "$file" in
              *.AppImage) extension="AppImage" ;;
              *.deb) extension="deb" ;;
              *) continue ;;
            esac
            destination="release-assets/Kaede-Chat-${GITHUB_REF_NAME}-linux-x86_64.${extension}"
            cp "$file" "$destination"
            if [ -f "$file.sig" ]; then cp "$file.sig" "$destination.sig"; fi
          done < <(find desktop/target/release/bundle -type f \
            \( -name '*.AppImage' -o -name '*.deb' \) -print0)
          test -s "release-assets/Kaede-Chat-${GITHUB_REF_NAME}-linux-x86_64.AppImage.sig"
          test -n "$(find release-assets -type f -print -quit)"
          for file in release-assets/*; do
            name="$(basename "$file")"
            (cd release-assets && sha256sum "$name" > "$name.sha256")
          done
      - name: Upload Linux release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaede-chat-linux-x86_64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
      - name: Enforce desktop cache size budgets
        if: always()
        run: bash .github/scripts/enforce-cache-budgets.sh desktop-release

  desktop-windows:
    needs: [preflight, ci]
    if: needs.preflight.outputs.desktop == 'true'
    name: Windows desktop
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.13.15" }
      - name: Set client versions from release tag
        shell: bash
        run: python .github/scripts/check-release-inputs.py --stamp --tag "$GITHUB_REF_NAME"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: cargo-download-v1-rust-${{ env.RUST_VERSION }}-${{ hashFiles('desktop/Cargo.lock') }}
          enableCrossOsArchive: true
      - name: Build embedded frontend
        shell: bash
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build
      - name: Import Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_BASE64 -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw "WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD are required"
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "kaede-release.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure Tauri Authenticode signing
        shell: pwsh
        run: |
          $config = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $env:WINDOWS_CERTIFICATE_THUMBPRINT
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Depth 4
          Set-Content desktop/tauri/src-tauri/tauri.windows.conf.json $config -Encoding utf8
      - name: Cache pinned Tauri CLI
        id: tauri-cli-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: cargo-tauri-cli-v1-${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_VERSION }}-tauri-${{ env.TAURI_CLI_VERSION }}
      - name: Install pinned Tauri CLI
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo +"$RUST_VERSION" install tauri-cli --version "$TAURI_CLI_VERSION" --locked
      - name: Verify pinned Tauri CLI
        shell: bash
        run: |
          version_output="$(cargo +"$RUST_VERSION" tauri --version)"
          printf '%s\n' "$version_output"
          case "$version_output" in
            *"$TAURI_CLI_VERSION"*) ;;
            *) echo "unexpected Tauri CLI version" >&2; exit 1 ;;
          esac
      - name: Build signed Windows installer
        shell: bash
        working-directory: desktop/tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          cargo +"$RUST_VERSION" tauri build \
            --config src-tauri/tauri.conf.json \
            --bundles nsis -- --locked
      - name: Collect Windows release files
        shell: pwsh
        run: |
          $installer = Get-ChildItem "desktop\target\release\bundle\nsis\*-setup.exe" |
            Select-Object -First 1
          if (-not $installer) { throw "The NSIS installer was not produced" }
          if (-not (Test-Path "$($installer.FullName).sig")) {
            throw "The signed NSIS updater signature was not produced"
          }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $installerName = "Kaede-Chat-$($env:GITHUB_REF_NAME)-windows-x86_64-setup.exe"
          $installerDestination = Join-Path "release-assets" $installerName
          Copy-Item $installer.FullName $installerDestination
          Copy-Item "$($installer.FullName).sig" "$installerDestination.sig"
          $hash = (Get-FileHash -Algorithm SHA256 $installerDestination).Hash.ToLowerInvariant()
          "$hash  $installerName" | Set-Content "$installerDestination.sha256" -Encoding ascii
      - name: Upload Windows release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaede-chat-windows-x86_64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
      - name: Enforce desktop cache size budgets
        if: always()
        shell: bash
        run: bash .github/scripts/enforce-cache-budgets.sh desktop-release

  desktop-macos:
    needs: [preflight, ci]
    if: needs.preflight.outputs.desktop == 'true'
    name: macOS desktop (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.13.15" }
      - name: Set client versions from release tag
        shell: bash
        run: python .github/scripts/check-release-inputs.py --stamp --tag "$GITHUB_REF_NAME"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: cargo-download-v1-rust-${{ env.RUST_VERSION }}-${{ hashFiles('desktop/Cargo.lock') }}
          enableCrossOsArchive: true
      - name: Build embedded frontend
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build
      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          certificate="$RUNNER_TEMP/kaede-release.p12"
          keychain="$RUNNER_TEMP/kaede-release.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$keychain"
      - name: Cache pinned Tauri CLI
        id: tauri-cli-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: cargo-tauri-cli-v1-${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_VERSION }}-tauri-${{ env.TAURI_CLI_VERSION }}
      - name: Install pinned Tauri CLI
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo +"$RUST_VERSION" install tauri-cli --version "$TAURI_CLI_VERSION" --locked
      - name: Verify pinned Tauri CLI
        run: |
          version_output="$(cargo +"$RUST_VERSION" tauri --version)"
          printf '%s\n' "$version_output"
          case "$version_output" in
            *"$TAURI_CLI_VERSION"*) ;;
            *) echo "unexpected Tauri CLI version" >&2; exit 1 ;;
          esac
      - name: Build, sign, and notarize macOS packages
        working-directory: desktop/tauri
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_API_KEY"
          test -n "$APPLE_API_ISSUER"
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/kaede-notarization.p8"
          trap 'rm -f "$APPLE_API_KEY_PATH"' EXIT
          umask 077
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 -D > "$APPLE_API_KEY_PATH"
          cargo +"$RUST_VERSION" tauri build \
            --config src-tauri/tauri.conf.json \
            --bundles app,dmg -- --locked
      - name: Collect macOS release files
        run: |
          set -euo pipefail
          mkdir -p release-assets
          arch="${{ matrix.arch }}"
          dmg="$(find desktop/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          test -s "$dmg"
          cp "$dmg" "release-assets/Kaede-Chat-${GITHUB_REF_NAME}-macos-${arch}.dmg"
          app="$(find desktop/target/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -n "$app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$app" \
              "release-assets/Kaede-Chat-${GITHUB_REF_NAME}-macos-${arch}.zip"
          fi
          updater="$(find desktop/target/release/bundle/macos -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
          test -n "$updater"
          updater_destination="release-assets/Kaede-Chat-${GITHUB_REF_NAME}-macos-${arch}.app.tar.gz"
          cp "$updater" "$updater_destination"
          cp "$updater.sig" "$updater_destination.sig"
          test -n "$(find release-assets -type f -print -quit)"
          for file in release-assets/*; do
            name="$(basename "$file")"
            (cd release-assets && shasum -a 256 "$name" > "$name.sha256")
          done
      - name: Upload macOS release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaede-chat-macos-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
      - name: Enforce desktop cache size budgets
        if: always()
        run: bash .github/scripts/enforce-cache-budgets.sh desktop-release

  android:
    needs: [preflight, ci]
    if: needs.preflight.outputs.android == 'true'
    name: Android APK and AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install pinned Flutter SDK
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git flutter
          echo "${{ runner.temp }}/flutter/bin" >> "$GITHUB_PATH"
      - name: Cache pinned Flutter runtime artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/flutter/bin/cache
          key: flutter-android-v1-${{ runner.os }}-${{ env.FLUTTER_VERSION }}
      - name: Install pinned Rust Android targets
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup target add --toolchain "$RUST_VERSION" \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android
      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: cargo-download-v1-rust-${{ env.RUST_VERSION }}-${{ hashFiles('desktop/Cargo.lock') }}
          enableCrossOsArchive: true
      - name: Cache Dart packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.pub-cache/hosted
            ~/.pub-cache/git
          key: dart-pub-v1-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('mobile/pubspec.lock') }}
      - name: Cache Android dependency downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches/modules-2/files-2.1
            ~/.gradle/caches/modules-2/metadata-*
            ~/.gradle/wrapper/dists
          key: gradle-download-v1-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('mobile/pubspec.lock', 'mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          keystore="$RUNNER_TEMP/kaede-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=%s\n' "$keystore"
          } > android/key.properties
          chmod 600 "$keystore" android/key.properties
      - name: Inject official Firebase client configuration
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_GOOGLE_SERVICES_JSON_BASE64"
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode \
            > android/app/google-services.json
          python3 -c 'import json; d=json.load(open("android/app/google-services.json")); clients=d.get("client", []); assert any(c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "chat.kaede.mobile" for c in clients), "Firebase config is not for chat.kaede.mobile"'
          chmod 600 android/app/google-services.json
      - name: Set Android release version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#desktop-v}"
          version="${version#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          # Reserve two digits for retries; never reuse a Play version code.
          (( GITHUB_RUN_ATTEMPT > 0 && GITHUB_RUN_ATTEMPT < 100 ))
          version_code=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          (( version_code > 0 && version_code <= 2100000000 ))
          echo "ANDROID_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
      - name: Validate and build signed Android releases
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
          flutter build apk --release \
            --build-name="$ANDROID_RELEASE_VERSION" \
            --build-number="$ANDROID_RELEASE_VERSION_CODE" \
            --dart-define=KAEDE_PUSH_TRANSPORT=relay \
            --dart-define=KAEDE_PUSH_RELAY_URL=https://push.kaede.chat \
            --dart-define=KAEDE_PUSH_RELAY_ORIGIN=kaede.chat \
            --dart-define=KAEDE_PUSH_APP_ID=chat.kaede.mobile
          flutter build appbundle --release \
            --build-name="$ANDROID_RELEASE_VERSION" \
            --build-number="$ANDROID_RELEASE_VERSION_CODE" \
            --dart-define=KAEDE_PUSH_TRANSPORT=relay \
            --dart-define=KAEDE_PUSH_RELAY_URL=https://push.kaede.chat \
            --dart-define=KAEDE_PUSH_RELAY_ORIGIN=kaede.chat \
            --dart-define=KAEDE_PUSH_APP_ID=chat.kaede.mobile
      - name: Collect Android release files
        run: |
          set -euo pipefail
          mkdir -p release-assets
          apk="Kaede-Chat-${GITHUB_REF_NAME}-android.apk"
          bundle="Kaede-Chat-${GITHUB_REF_NAME}-android-play.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "release-assets/$apk"
          cp build/app/outputs/bundle/release/app-release.aab "release-assets/$bundle"
          (cd release-assets && sha256sum "$apk" > "$apk.sha256")
          (cd release-assets && sha256sum "$bundle" > "$bundle.sha256")
      - name: Upload Android release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaede-chat-android
          path: mobile/release-assets/*
          if-no-files-found: error
          retention-days: 7
      - name: Enforce mobile cache size budgets
        if: always()
        working-directory: ${{ github.workspace }}
        shell: bash
        run: bash .github/scripts/enforce-cache-budgets.sh mobile

  ios:
    needs: [preflight, ci]
    name: iOS IPA
    if: needs.preflight.outputs.ios == 'true' && vars.IOS_RELEASE_ENABLED == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Verify iOS release toolchain and version
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $sdk_version"
          if (( ${sdk_version%%.*} < 26 )); then
            echo "App Store Connect requires the iOS 26 SDK or later" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#desktop-v}"
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "iOS release tags must contain a numeric major.minor.patch version" >&2
            exit 1
          fi
          echo "IOS_BUILD_NAME=$version" >> "$GITHUB_ENV"
      - name: Install pinned Flutter SDK
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git flutter
          echo "${{ runner.temp }}/flutter/bin" >> "$GITHUB_PATH"
      - name: Install pinned CocoaPods
        run: |
          gem_home="$RUNNER_TEMP/cocoapods-gems"
          GEM_HOME="$gem_home" GEM_PATH="$gem_home" gem install cocoapods --version "$COCOAPODS_VERSION" --no-document
          echo "GEM_HOME=$gem_home" >> "$GITHUB_ENV"
          echo "GEM_PATH=$gem_home" >> "$GITHUB_ENV"
          echo "$gem_home/bin" >> "$GITHUB_PATH"
          GEM_HOME="$gem_home" GEM_PATH="$gem_home" "$gem_home/bin/pod" --version
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Cache Dart and Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.pub-cache/hosted
            ~/.pub-cache/git
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            ~/.cocoapods/repos
            ~/Library/Caches/CocoaPods
          key: ios-v1-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('mobile/pubspec.lock', 'desktop/Cargo.lock') }}
      - name: Install iOS signing material
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_BROADCAST_PROFILE_BASE64: ${{ secrets.IOS_BROADCAST_PROFILE_BASE64 }}
          IOS_NOTIFICATION_PROFILE_BASE64: ${{ secrets.IOS_NOTIFICATION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for value in IOS_DISTRIBUTION_CERTIFICATE_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_APP_PROFILE_BASE64 IOS_BROADCAST_PROFILE_BASE64 IOS_NOTIFICATION_PROFILE_BASE64; do
            test -n "${!value}"
          done
          certificate="$RUNNER_TEMP/kaede-ios-distribution.p12"
          keychain="$RUNNER_TEMP/kaede-ios.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security import "$certificate" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$IOS_APP_PROFILE_BASE64" | base64 -D > "$HOME/Library/MobileDevice/Provisioning Profiles/kaede-app.mobileprovision"
          printf '%s' "$IOS_BROADCAST_PROFILE_BASE64" | base64 -D > "$HOME/Library/MobileDevice/Provisioning Profiles/kaede-broadcast.mobileprovision"
          printf '%s' "$IOS_NOTIFICATION_PROFILE_BASE64" | base64 -D > "$HOME/Library/MobileDevice/Provisioning Profiles/kaede-notification.mobileprovision"
      - name: Inject official Firebase client configuration
        env:
          IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64"
          printf '%s' "$IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 -D > ios/Runner/GoogleService-Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' ios/Runner/GoogleService-Info.plist)" = "chat.kaede.mobile"
          chmod 600 ios/Runner/GoogleService-Info.plist
      - name: Validate and build signed iOS release
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
          ./tool/build_e2ee_native.sh --ios
          flutter precache --ios
          pod install --deployment --project-directory=ios
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist \
            --build-name="$IOS_BUILD_NAME" \
            --build-number="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --dart-define=KAEDE_PUSH_TRANSPORT=relay \
            --dart-define=KAEDE_PUSH_RELAY_URL=https://push.kaede.chat \
            --dart-define=KAEDE_PUSH_RELAY_ORIGIN=kaede.chat \
            --dart-define=KAEDE_PUSH_APP_ID=chat.kaede.mobile
      - name: Collect iOS release file
        run: |
          set -euo pipefail
          mkdir -p release-assets
          ipa="$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$ipa"
          destination="release-assets/Kaede-Chat-${GITHUB_REF_NAME}-ios.ipa"
          cp "$ipa" "$destination"
          (cd release-assets && shasum -a 256 "$(basename "$destination")" > "$(basename "$destination").sha256")
      - name: Upload iOS release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaede-chat-ios
          path: mobile/release-assets/*
          if-no-files-found: error
          retention-days: 7

  google-play:
    name: Upload Google Play open testing
    needs: [publish, android]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download signed Android release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaede-chat-android
          path: release-assets
      - name: Upload Android release to Google Play open testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: chat.kaede.mobile
          releaseFiles: release-assets/*-android-play.aab
          releaseName: ${{ github.ref_name }}
          tracks: beta
          status: completed
          changesNotSentForReview: false

  testflight:
    name: Upload TestFlight
    needs: [publish, ios]
    if: >-
      !cancelled() &&
      needs.publish.result == 'success' &&
      needs.ios.result == 'success' &&
      vars.IOS_TESTFLIGHT_UPLOAD_ENABLED == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Download signed iOS release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaede-chat-ios
          path: release-assets
      - name: Upload iOS release to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64"
          key_directory="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_directory"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 -D \
            > "$key_directory/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$key_directory/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          ipa="$(find release-assets -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

  publish:
    name: Publish GitHub Release
    needs: [preflight, ci, desktop-linux, desktop-windows, desktop-macos, android, ios]
    if: >-
      !cancelled() &&
      needs.preflight.result == 'success' &&
      needs.ci.result == 'success' &&
      ((needs.preflight.outputs.desktop == 'true' &&
        needs.desktop-linux.result == 'success' &&
        needs.desktop-windows.result == 'success' &&
        needs.desktop-macos.result == 'success') ||
       (needs.preflight.outputs.desktop == 'false' &&
        needs.desktop-linux.result == 'skipped' &&
        needs.desktop-windows.result == 'skipped' &&
        needs.desktop-macos.result == 'skipped')) &&
      ((needs.preflight.outputs.android == 'true' && needs.android.result == 'success') ||
       (needs.preflight.outputs.android == 'false' && needs.android.result == 'skipped')) &&
      ((needs.preflight.outputs.ios == 'true' && vars.IOS_RELEASE_ENABLED == 'true' &&
        needs.ios.result == 'success') ||
       ((needs.preflight.outputs.ios == 'false' || vars.IOS_RELEASE_ENABLED != 'true') &&
        needs.ios.result == 'skipped')) &&
      (needs.desktop-linux.result == 'success' || needs.android.result == 'success' ||
       needs.ios.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download client release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true
      - name: Create signed desktop update manifest
        if: needs.preflight.outputs.desktop == 'true'
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#desktop-v}"
          version="${version#v}"
          export version
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          assets = Path("release-assets")
          tag = os.environ["GITHUB_REF_NAME"]
          version = os.environ["version"]
          repository = os.environ["REPOSITORY"]
          names = {
              "windows-x86_64": f"Kaede-Chat-{tag}-windows-x86_64-setup.exe",
              "linux-x86_64": f"Kaede-Chat-{tag}-linux-x86_64.AppImage",
              "darwin-x86_64": f"Kaede-Chat-{tag}-macos-x86_64.app.tar.gz",
              "darwin-aarch64": f"Kaede-Chat-{tag}-macos-arm64.app.tar.gz",
          }
          platforms = {}
          for platform, name in names.items():
              artifact = assets / name
              signature = assets / f"{name}.sig"
              if not artifact.is_file() or not signature.is_file():
                  raise SystemExit(f"incomplete updater artifact or signature for {platform}")
              platforms[platform] = {
                  "url": f"https://github.com/{repository}/releases/download/{tag}/{name}",
                  "signature": signature.read_text(encoding="utf-8").strip(),
              }
          manifest = {
              "version": version,
              "notes": f"Kaede Chat {version}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
              "platforms": platforms,
          }
          (assets / "latest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Preserve desktop updater on mobile-only releases
        if: needs.preflight.outputs.desktop == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DESKTOP_BASE: ${{ needs.preflight.outputs.desktop_base }}
        run: |
          set -euo pipefail
          test -n "$DESKTOP_BASE"
          gh release download "$DESKTOP_BASE" --pattern latest.json --dir release-assets
      - name: Publish tag release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$(find release-assets -type f -print -quit)"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              --draft \
              --title "Kaede Chat $GITHUB_REF_NAME"
          fi
          find release-assets -type f -print0 | \
            xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
          gh release edit "$GITHUB_REF_NAME" \
            --title "Kaede Chat $GITHUB_REF_NAME" \
            --draft=false
