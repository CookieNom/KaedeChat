name: Desktop release build

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: kaede-chat-linux-x86_64
          - os: windows-2025
            artifact: kaede-chat-windows-x86_64
          - os: macos-15
            artifact: kaede-chat-macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake file libasound2-dev libayatana-appindicator3-dev libdbus-1-dev libgtk-3-dev librsvg2-dev libssl-dev libudev-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf pkg-config wget
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with: { version: "10.34.0", run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22.23.1", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal
      - name: Cache Cargo artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: desktop-release-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend check
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      - name: Install pinned Tauri CLI
        run: cargo +1.92.0 install tauri-cli --version 2.11.4 --locked
      - name: Build platform bundles
        working-directory: desktop/tauri
        run: cargo +1.92.0 tauri build --config src-tauri/tauri.conf.json
      - name: Write checksums
        shell: bash
        run: |
          mkdir -p desktop/dist
          find desktop/target/release/bundle -type f -exec cp {} desktop/dist/ \;
          cd desktop/dist
          if command -v sha256sum >/dev/null; then sha256sum * > SHA256SUMS; else shasum -a 256 * > SHA256SUMS; fi
      - name: Upload packaged build for release approval
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: desktop/dist/*
          if-no-files-found: error
