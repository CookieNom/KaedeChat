name: Python SDK

on:
  pull_request:
    paths: ['sdk/python/**', '.github/workflows/sdk-publish.yml']
  push:
    branches: [main]
    paths: ['sdk/python/**', '.github/workflows/sdk-publish.yml']
    tags: ['sdk-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  encrypted-voice:
    if: startsWith(github.ref, 'refs/tags/sdk-v') && github.event_name == 'push'
    uses: ./.github/workflows/bot-voice-interop.yml

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with: { version: '0.11.8', enable-cache: true }
      - name: Validate committed SDK lockfile before version stamping
        run: uv lock --project sdk/python --check --python 3.11
      - name: Set SDK version from release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^sdk-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          uv version --project sdk/python --no-sync "${RELEASE_TAG#sdk-v}"
      - run: uv sync --project sdk/python --locked --python 3.11
      - run: uv build --project sdk/python --no-sources
      - run: uv run --project sdk/python --no-sync twine check --strict sdk/python/dist/*
      - name: Test installed wheel and source distribution
        run: |
          for artifact in sdk/python/dist/*.whl sdk/python/dist/*.tar.gz; do
            uv pip install --python sdk/python/.venv/bin/python --no-deps --reinstall "$artifact"
            uv run --project sdk/python --no-sync python -I -c 'import kaede_bot; from importlib.resources import files; assert files("kaede_bot").joinpath("py.typed").is_file()'
            uv run --project sdk/python --no-sync pytest -q sdk/python/tests
          done
      - uses: ./.github/actions/upload-artifact
        with:
          name: python-sdk-distributions
          path: sdk/python/dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/sdk-v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/kaede-bot/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-sdk-distributions
          path: dist
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with: { version: '0.11.8', enable-cache: false }
      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        run: |
          if [ -n "$UV_PUBLISH_TOKEN" ]; then
            uv publish --trusted-publishing never dist/*
          else
            uv publish --trusted-publishing always dist/*
          fi

  publish-voice-library:
    needs: [publish, encrypted-voice]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaede-bot-voice-linux-x86_64
          path: dist
      - name: Attach the verified voice library to the SDK release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        working-directory: dist
        run: |
          bundle=kaede-bot-voice-linux-x86_64.tar.gz
          sha256sum --check "$bundle.sha256"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" "$bundle" "$bundle.sha256" \
              --verify-tag --latest=false --title "Python SDK ${GITHUB_REF_NAME#sdk-v}" \
              --notes "Optional Linux x86_64 native library for encrypted Python bot voice."
          else
            assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
            missing=()
            for file in "$bundle" "$bundle.sha256"; do
              if grep -Fxq "$file" <<< "$assets"; then
                gh release download "$GITHUB_REF_NAME" --pattern "$file" --dir "$RUNNER_TEMP/existing"
                cmp "$file" "$RUNNER_TEMP/existing/$file"
              else
                missing+=("$file")
              fi
            done
            if ((${#missing[@]})); then
              gh release upload "$GITHUB_REF_NAME" "${missing[@]}"
            fi
          fi
