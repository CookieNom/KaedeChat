name: Mobile WebRTC

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-24.04
          - platform: ios
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Restore patched native binaries
        id: native
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            mobile/native/webrtc/android
            mobile/native/webrtc/WebRTC.xcframework
            mobile/native/webrtc/*-build.json
          key: kaede-av1-${{ matrix.platform }}-${{ hashFiles('mobile/tool/build_webrtc.py', 'docs/av1-e2ee/webrtc-build.patch', '.github/workflows/mobile-webrtc.yml') }}
      - name: Linux build dependencies
        if: steps.native.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          # Native WebRTC fetches its own Android SDK; reclaim unused runner SDKs.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config python3-setuptools rsync unzip xz-utils libglib2.0-dev
      - name: Select Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Build encrypted AV1 WebRTC
        if: steps.native.outputs.cache-hit != 'true'
        run: python3 mobile/tool/build_webrtc.py "${{ matrix.platform }}" --work-dir "$RUNNER_TEMP/kaede-webrtc"
      - name: Preserve framework symlinks
        run: tar -cf "$RUNNER_TEMP/webrtc-${{ matrix.platform }}.tar" -C mobile/native/webrtc .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaede-webrtc-${{ matrix.platform }}
          path: ${{ runner.temp }}/webrtc-${{ matrix.platform }}.tar
          if-no-files-found: error
